<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>채팅</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f2f2f2; }
  header { background: #333; color: #fff; padding: 0.8rem 1rem; display: flex; justify-content: space-between; align-items: center; }
  header button { background: none; border: 1px solid #fff; color: #fff; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; }
  #messages { flex: 1; overflow-y: auto; padding: 1rem; }
  .msg { margin-bottom: 0.6rem; }
  .msg .who { font-weight: bold; margin-right: 0.4rem; }
  .msg .when { color: #888; font-size: 0.75rem; margin-left: 0.4rem; }
  .msg.mine .who { color: #1a73e8; }
  form#sendForm { display: flex; padding: 0.6rem; background: #fff; border-top: 1px solid #ddd; }
  #content { flex: 1; padding: 0.6rem; }
  #sendForm button { padding: 0.6rem 1.2rem; margin-left: 0.5rem; }
</style>
</head>
<body>
  <header>
    <span id="whoami"></span>
    <button id="logoutBtn">로그아웃</button>
  </header>
  <div id="messages"></div>
  <form id="sendForm">
    <input type="text" id="content" placeholder="메시지를 입력하세요" autocomplete="off" required>
    <button type="submit">보내기</button>
  </form>
  <script src="chat.js"></script>
</body>
</html>
