<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Todo List{% endblock %}</title>
<link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}">
</head>
<body>

<div class="topbar">
  <a class="brand" href="{{ request.url_for('list_todos') }}">◂ Todo List</a>
  <nav>
    <a href="{{ request.url_for('list_todos') }}">목록</a>
    <a href="{{ request.url_for('new_todo_form') }}">새 할 일</a>
  </nav>
</div>

<header class="hero">
  <span class="badge">Python + FastAPI · 파일 DB(SQLite)</span>
  <h1>{% block hero_title %}Todo List{% endblock %}</h1>
  <p>{% block hero_subtitle %}오늘 할 일을 등록하고 관리해보세요.{% endblock %}</p>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  ITCS 기초지식부터 풀스택까지 · 제로에서 시작하는 바이브코딩
</footer>

</body>
</html>
