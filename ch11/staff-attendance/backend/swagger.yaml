openapi: 3.0.3
info:
  title: 소규모 사업장 근태관리 API
  version: 1.0.0
  description: >-
    임직원 20명 내외 소규모 사업장을 위한 근태관리 API. 회원가입/로그인/JWT 인증(RBAC), 출퇴근 체크인/체크아웃, 연차 신청/승인/반려, 월별 근태 현황 조회 기능을 제공한다. 근거:
    docs/1-prd.md 5.1/4.2/6/8절, docs/2-user-scenario.md, docs/4-erd.md.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
tags:
  - name: Auth
    description: 회원가입/로그인/토큰 관리
  - name: Users
    description: 사용자 정보/계정 관리
  - name: Attendances
    description: 출퇴근 체크인/체크아웃 및 조회
  - name: LeaveRequests
    description: 연차 신청/승인/반려
  - name: LeaveBalances
    description: 연차 잔여일수 조회
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "로그인 시 발급되는 Access Token(유효기간 12시간)을 Authorization: Bearer {token} 헤더로 전달한다. (PRD 5.1)"
  schemas:
    Role:
      type: string
      enum:
        - manager
        - employee
      description: 사용자 역할(RBAC). 최초 가입자는 manager, 이후는 employee로 자동 등록된다(PRD 5.1).
    UserStatus:
      type: string
      enum:
        - active
        - inactive
      description: 계정 상태. inactive 계정은 로그인 시 403 응답(PRD 8).
    LeaveRequestStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
      description: 대기중/승인됨/반려됨(4-erd.md leave_requests.status)
    User:
      type: object
      description: 4-erd.md users 테이블 기반 응답 DTO(password_hash 제외)
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        employeeNo:
          type: string
          description: 사번(고유 식별자)
        hireDate:
          type: string
          format: date
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - employeeNo
        - hireDate
        - role
        - status
    SignupRequest:
      type: object
      description: 회원가입 요청(PRD 5.1, 시나리오1). 최초 가입자는 manager, 이후는 employee로 자동 등록
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        employeeNo:
          type: string
        hireDate:
          type: string
          format: date
        password:
          type: string
          format: password
          minLength: 8
      required:
        - email
        - name
        - employeeNo
        - hireDate
        - password
    CreateManagerRequest:
      type: object
      description: manager 전용 관리자 계정 생성 요청(PRD 5.1, 시나리오7). 생성된 계정은 role=manager로 등록됨
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        employeeNo:
          type: string
        hireDate:
          type: string
          format: date
        password:
          type: string
          format: password
          minLength: 8
      required:
        - email
        - name
        - employeeNo
        - hireDate
        - password
    LoginRequest:
      type: object
      description: 로그인 요청(PRD 5.1)
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password
    RefreshRequest:
      type: object
      description: "Access Token 재발급 요청(PRD 5.1: Refresh Token 유효기간 7일)"
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    TokenResponse:
      type: object
      description: "JWT 토큰 응답(PRD 5.1: Access Token 12시간, Refresh Token 7일)"
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Access Token 만료까지 초 단위 시간
          example: 43200
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    ChangePasswordRequest:
      type: object
      description: 비밀번호 변경 요청(PRD 5.1, 시나리오8). 현재 비밀번호 확인 후에만 변경 가능
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
      required:
        - currentPassword
        - newPassword
    Attendance:
      type: object
      description: 4-erd.md attendances 테이블 기반 응답 DTO
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        workDate:
          type: string
          format: date
          description: 체크인 시각(KST) 기준으로 확정되는 근무일
        checkInAt:
          type: string
          format: date-time
          nullable: true
        checkOutAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - workDate
    LeaveRequestCreateRequest:
      type: object
      description: 연차 신청 요청(PRD 5.1, 시나리오3). halfDay 미지정 시 종일(1일) 단위, am/pm 지정 시 0.5일 반차(시작일=종료일이어야 함)
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
        halfDay:
          type: string
          enum: [am, pm]
          nullable: true
          description: 반차 구분(오전/오후). 미지정 시 종일 신청. 지정 시 startDate와 endDate가 같아야 하며 신청 일수는 0.5일로 고정
      required:
        - startDate
        - endDate
        - reason
    LeaveRequest:
      type: object
      description: 4-erd.md leave_requests 테이블 기반 응답 DTO
      properties:
        id:
          type: string
          format: uuid
        requesterId:
          type: string
          format: uuid
        requesterName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        days:
          type: number
          format: float
          description: 신청 일수(종일 1, 반차 0.5)
        halfDay:
          type: string
          enum: [am, pm]
          nullable: true
          description: 반차 구분(오전/오후). 종일 신청이면 null
        reason:
          type: string
        status:
          $ref: "#/components/schemas/LeaveRequestStatus"
        processorId:
          type: string
          format: uuid
          nullable: true
        processorName:
          type: string
          nullable: true
        processedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - requesterId
        - startDate
        - endDate
        - days
        - reason
        - status
    LeaveBalance:
      type: object
      description: 4-erd.md leave_balances 테이블 기반 응답 DTO
      properties:
        userId:
          type: string
          format: uuid
        totalDays:
          type: number
          format: float
        usedDays:
          type: number
          format: float
        remainingDays:
          type: number
          format: float
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - totalDays
        - usedDays
        - remainingDays
    LeavePolicy:
      type: object
      description: 전사 공통 연차 정책(공통 기본 연차일수). 각 직원의 총 연차일수는 입사연도 기준으로 자동 계산된다 — 해당연도 입사자는 0일, 전년도 입사자는 baseDays, 그 이전 입사자는 baseDays+(지난 햇수-1).
      properties:
        id:
          type: integer
        baseDays:
          type: number
          format: float
        updatedAt:
          type: string
          format: date-time
      required:
        - baseDays
    ErrorResponse:
      type: object
      description: 공통 에러 응답 형식
      properties:
        code:
          type: string
          example: DUPLICATE_EMPLOYEE_NO
        message:
          type: string
          example: 이미 등록된 사번입니다
      required:
        - code
        - message
  responses:
    BadRequest:
      description: 잘못된 요청(유효성 검증 실패 등)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 인증 실패 또는 토큰 없음/만료
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 권한 없음(RBAC 위반 등)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 리소스 충돌(중복/이미 처리됨 등)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
paths:
  /auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      description: email/이름/사번/입사일/비밀번호로 회원가입한다. 최초 가입자는 manager, 이후는 employee로 자동 등록된다(PRD 5.1/4.2, 시나리오1). 비밀번호는 해시되어 저장된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: "사번 중복(시나리오1 예외 상황: '이미 등록된 사번입니다')"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 이메일/비밀번호로 로그인해 Access Token(12시간)/Refresh Token(7일)을 발급받는다(PRD 5.1, 시나리오1). inactive 계정은 403 응답(PRD 8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 비활성화(inactive)된 계정(PRD 8 엣지 케이스)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Access Token 재발급
      description: Refresh Token으로 새로운 Access Token을 재발급한다(PRD 5.1). Refresh Token도 만료된 경우 401 응답으로 재로그인을 요구한다(PRD 8 엣지 케이스).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh Token이 유효하지 않거나 만료됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 로그아웃
      description: 로그아웃 처리 엔드포인트. 실제 토큰 삭제는 클라이언트에서 즉시 수행하며, 서버 측 Refresh Token 무효화(블랙리스트)는 1차 버전 범위에 포함하지 않는다(PRD 5.2, 시나리오9).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 로그아웃 처리 완료(응답 본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me:
    get:
      tags:
        - Users
      summary: 내 정보 조회
      description: 로그인한 사용자 본인의 정보(이름/이메일/사번/입사일/역할)를 조회한다(PRD 5.1, 와이어프레임 9번 화면).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/password:
    patch:
      tags:
        - Users
      summary: 비밀번호 변경
      description: 현재 비밀번호 확인 후 새 비밀번호로 변경한다(PRD 5.1/4.2, 시나리오8). 변경 완료 후 재로그인 또는 토큰 재발급이 이루어진다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: 비밀번호 변경 성공, 신규 토큰 재발급
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: 현재 비밀번호 불일치(시나리오8 예외 상황)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    post:
      tags:
        - Users
      summary: 관리자(manager) 계정 생성
      description: manager가 신규 manager 계정을 직접 생성한다(PRD 5.1/4.2, 시나리오7, 와이어프레임 8번 화면). manager만 접근 가능, employee 접근 시 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManagerRequest"
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: employee 접근 시 차단(시나리오7 예외 상황)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "사번 중복(시나리오7 기대 결과: 일반 회원가입과 동일한 검증)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Users
      summary: 사용자 목록 조회
      description: manager가 전체 사용자 목록(사번/이름/역할/입사일/상태)을 조회한다(와이어프레임 8번 화면). manager 전용, employee 접근 시 403.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /attendances/check-in:
    post:
      tags:
        - Attendances
      summary: 출근 체크인
      description: 당일 체크인 시각을 서버 시간(KST) 기준으로 기록한다(PRD 5.1, 시나리오2). 당일 이미 체크인한 경우 409 응답.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: 체크인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "이미 체크인한 상태에서 재차 체크인 시도(PRD 8, 시나리오2 예외A: '이미 체크인하셨습니다')"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendances/check-out:
    post:
      tags:
        - Attendances
      summary: 퇴근 체크아웃
      description: 당일 체크인 기록이 있는 경우에만 체크아웃 시각을 기록한다(PRD 5.1, 시나리오2). 자정을 넘겨도 체크인일의 work_date에 귀속된다. 체크인과 달리 체크아웃은 여러 번 호출 가능하며, 매번 최종 호출 시각으로 checkOutAt이 갱신된다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 체크아웃 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "400":
          description: "체크인 기록이 없는 상태에서 체크아웃 시도(PRD 8, 시나리오2 예외B: '체크인 기록이 없습니다')"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /attendances/me:
    get:
      tags:
        - Attendances
      summary: 내 월별 출퇴근 조회
      description: 본인의 월별 출퇴근 기록을 조회한다(PRD 5.1, 시나리오5). 본인 데이터만 조회 가능.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          description: 조회 월(YYYY-MM)
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
            example: 2026-08
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /attendances:
    get:
      tags:
        - Attendances
      summary: 전체 직원 월별 출퇴근 조회(manager 전용)
      description: manager가 월과 대상(전체/개별 직원)을 선택해 출퇴근 기록을 조회한다(PRD 5.1, 시나리오6). employee 접근 시 403.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          description: 조회 월(YYYY-MM)
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
            example: 2026-08
        - name: userId
          in: query
          required: false
          description: 특정 직원 필터(미지정 시 전체 직원)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: employee 접근 시 차단(시나리오6 기대 결과)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /leave-requests:
    post:
      tags:
        - LeaveRequests
      summary: 연차 신청
      description: employee/manager 모두 본인 명의로 시작일/종료일/사유를 입력해 연차를 신청한다(PRD 5.1/4.2, 시나리오3). 시작일이 종료일보다 늦으면 400, 잔여 연차일수를 초과하면 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestCreateRequest"
      responses:
        "201":
          description: "신청 성공(상태: pending)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: "시작일 > 종료일(시나리오3 예외A) 또는 잔여 연차일수 부족(시나리오3 예외B: '잔여 연차일수가 부족합니다')"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags:
        - LeaveRequests
      summary: 전체 연차 신청 목록 조회(manager 전용)
      description: manager가 전체 직원의 연차 신청 목록을 상태/월/직원별로 조회한다(PRD 4.2/5.1, 와이어프레임 5·7번 화면). employee 접근 시 403.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 상태 필터(미지정 시 전체)
          schema:
            $ref: "#/components/schemas/LeaveRequestStatus"
        - name: month
          in: query
          required: false
          description: 조회 월(YYYY-MM). 시작일 또는 종료일이 해당 월에 포함된 신청 조회(미지정 시 전체 기간)
          schema:
            type: string
            pattern: ^\d{4}-\d{2}$
            example: 2026-08
        - name: userId
          in: query
          required: false
          description: 특정 직원 필터(미지정 시 전체 직원)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /leave-requests/me:
    get:
      tags:
        - LeaveRequests
      summary: 내 연차 신청 내역 조회
      description: 본인이 신청한 연차 신청 내역을 조회한다(PRD 4.2/5.1, 시나리오3/5).
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: false
          description: 조회 월(YYYY-MM). 시작일 또는 종료일이 해당 월에 포함된 신청 조회(미지정 시 전체 기간)
          schema:
            type: string
            pattern: ^\d{4}-\d{2}$
            example: 2026-08
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /leave-requests/{id}/approve:
    patch:
      tags:
        - LeaveRequests
      summary: 연차 승인(manager 전용)
      description: >-
        대기중(pending)인 연차 신청을 승인한다(PRD 5.1, 시나리오4). 처리자/신청자, 처리 시각, 결과가 기록되며 잔여 연차일수에서 차감된다. 본인이 신청한 건은 본인이 처리 불가(403),
        이미 처리된 건 재처리 시 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 연차 신청 ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "승인 성공(상태: approved)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "manager 본인이 신청한 연차를 스스로 처리하려는 경우(PRD 8, 시나리오4 예외B: '본인이 신청한 연차는 본인이 처리할 수 없습니다')"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "이미 처리된 신청 재처리 시도(PRD 8, 시나리오4 예외A: '이미 처리된 신청입니다')"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /leave-requests/{id}/reject:
    patch:
      tags:
        - LeaveRequests
      summary: 연차 반려(manager 전용)
      description: >-
        대기중(pending)인 연차 신청을 반려한다(PRD 5.1, 시나리오4). 처리자/신청자, 처리 시각, 결과가 기록된다. 본인이 신청한 건은 본인이 처리 불가(403), 이미 처리된 건 재처리 시
        409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 연차 신청 ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "반려 성공(상태: rejected)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: manager 본인이 신청한 연차를 스스로 처리하려는 경우(PRD 8, 시나리오4 예외B)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 이미 처리된 신청 재처리 시도(PRD 8, 시나리오4 예외A)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /leave-balances/me:
    get:
      tags:
        - LeaveBalances
      summary: 내 잔여 연차 조회
      description: 본인의 연차 잔여일수(총 부여일수/사용일수/잔여일수)를 조회한다(PRD 5.1, 와이어프레임 3/4번 화면).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 사용자의 LeaveBalance 레코드가 없는 경우(LEAVE_BALANCE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /leave-balances:
    get:
      tags:
        - LeaveBalances
      summary: 전체 사용자 연차 잔여 목록 조회
      description: manager가 전체 사용자의 연차 잔여현황(사번/이름/총/사용/잔여일수)을 조회한다. manager 전용, employee 접근 시 403.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /leave-policy:
    get:
      tags:
        - LeaveBalances
      summary: 공통 연차 정책 조회
      description: 전사 공통 기본 연차일수(`baseDays`)를 조회한다. 각 직원의 `totalDays`는 입사연도 기준으로 자동 계산된다(해당연도 입사자 0일, 전년도 입사자 baseDays, 그 이전 입사자 baseDays+(지난 햇수-1)). manager 전용.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeavePolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags:
        - LeaveBalances
      summary: 공통 연차 정책 수정
      description: 공통 기본 연차일수(`baseDays`)를 변경한다. 저장 즉시 전체 직원의 `totalDays`(입사연도 기준 자동계산)가 재계산되어 반영된다(usedDays는 유지). manager 전용, employee 접근 시 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseDays:
                  type: number
                  format: float
              required:
                - baseDays
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeavePolicy"
        "400":
          description: "baseDays가 음수이거나 형식이 올바르지 않음(VALIDATION_ERROR)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
